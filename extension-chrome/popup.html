<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Клипы со стримов</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="logo" src="icons/48.png" alt="">
    <div class="head-text">
      <b>Клипы со стримов</b>
      <span id="chanLabel"></span>
    </div>
    <button id="refresh" class="icon" type="button" title="Обновить список" aria-label="Обновить список">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </header>
  <form id="chanForm" autocomplete="off">
    <input id="chanInput" type="text" spellcheck="false" placeholder="@канал или ссылка на канал" aria-label="Канал">
    <button type="submit">Открыть</button>
  </form>
  <main id="list" aria-live="polite"></main>
  <footer>На странице любого видео YouTube клип делается кнопкой ✂ в плеере.</footer>
  <script src="popup.js"></script>
</body>
</html>
